[workspace]
resolver = "2"
members = [
  "crates/recrypt-ffi",
  "crates/recrypt-openfhe-sys",
  "crates/recrypt-core",
  "crates/recrypt-wire",
  "crates/recrypt-storage",
  "crates/identikey-storage-auth",
  "crates/identikey-auth",
  "crates/recrypt-client",
  "recrypt-server",
  "recrypt-cli",
  "tests/e2e",
  # "crates/recrypt-hdprint",  # parallel track
]
# cargo-fuzz crate builds standalone with nightly + sanitizer flags
exclude = ["crates/recrypt-ffi/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/identikey/recrypt"

[workspace.dependencies]
# Crypto
cxx = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1.7", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Testing
proptest = "1"

# Storage (Phase 4)
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bs58 = "0.5"
aws-sdk-s3 = "1"
aws-config = "1"

# Auth service (Phase 4b)
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"
serde_json = "1"

# Config & server middleware (Phase 8)
figment = { version = "0.10", features = ["toml", "env"] }
tower_governor = "0.7"

[profile.release]
lto = true
codegen-units = 1
