[package]
name = "identikey-storage-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authorization layer for content-addressed storage"

[features]
default = []
sqlite = ["rusqlite", "tokio-rusqlite"]

[dependencies]
# Workspace
recrypt-core = { path = "../recrypt-core" }
recrypt-wire = { path = "../recrypt-wire" }
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true

# Hashing
blake3 = "1"
bs58.workspace = true

# Envelope-native bearer-token wire format (recrypt-91h).
bc-envelope = "=0.43.0"
bc-components = "=0.31.1"
ed25519-dalek.workspace = true

# Random
rand.workspace = true

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

# Logging
tracing = "0.1"

# SQLite (optional)
rusqlite = { workspace = true, optional = true }
tokio-rusqlite = { workspace = true, optional = true }

[dev-dependencies]
recrypt-ffi = { path = "../recrypt-ffi" }
recrypt-storage = { path = "../recrypt-storage" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
