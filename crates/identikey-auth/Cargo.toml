[package]
name = "identikey-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IdentiKey hardware-enclave-backed challenge/response authentication protocol"

[dependencies]
# Classical signatures
ed25519-dalek = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa"] }
# Post-quantum signatures (FIPS 204 / ML-DSA), pure Rust, no C deps
fips204 = "0.4"
# Fingerprints + identifiers
blake3 = "1"
bs58 = { workspace = true }
# RNG for keygen + nonces
rand_core = { workspace = true }
# Hygiene + errors
zeroize = { workspace = true }
thiserror = { workspace = true }

# macOS Secure Enclave + Touch ID backend (target-gated so the base crate stays lean
# and dependency-free on other platforms).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2.17"
core-foundation = "0.10"

# Windows TPM (CNG Platform Crypto Provider) + Windows Hello backend.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }
sha2 = "0.10"

# Linux TPM 2.0 backend via the tpm2-tss ESAPI. System deps: tpm2-tss (libtss2-*).
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = "7.7"
sha2 = "0.10"

[dev-dependencies]
proptest = { workspace = true }
