[package]
name = "recrypt-wire"
version.workspace = true
edition.workspace = true

[dependencies]
# Gordian Envelope (dCBOR wire format)
# Pinned per migration plan alpha-status mitigation.
bc-envelope = "=0.43.0"

# Serialization (JSON for debug output, serde for config compat)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding
base64 = "0.22"
bs58 = "0.5"

# Core types (we serialize these)
recrypt-core = { path = "../recrypt-core" }
ed25519-dalek.workspace = true

# Error handling
thiserror.workspace = true

# Blake3 for hashing
blake3 = { version = "1.5", features = ["traits-preview"] }

[dev-dependencies]
proptest.workspace = true
recrypt-ffi = { path = "../recrypt-ffi" }
