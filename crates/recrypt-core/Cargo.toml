[package]
name = "recrypt-core"
version.workspace = true
edition.workspace = true

[dependencies]
# Crypto primitives
chacha20 = "0.9"                                            # XChaCha20 (192-bit nonce, no Poly1305)
blake3 = { version = "1.5", features = ["traits-preview"] }
bao-tree = { version = "0.16", default-features = false, features = ["validate", "tokio_fsm"] } # Blake3 verified streaming with chunk groups
bytes = "1"
rand = "0.8"
rand_core = "0.6"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Async runtime (used by streaming encrypt/decrypt API)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync"] }

# Secret zeroization
zeroize = { version = "1.7", features = ["derive"] }

# ED25519 signatures
ed25519-dalek.workspace = true

# FFI binding (our Phase 1 crate)
recrypt-ffi = { path = "../recrypt-ffi", default-features = false }

# Serialization for BackendId
serde = { version = "1.0", features = ["derive"] }

# Property testing (optional)
proptest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = ["openfhe", "liboqs"]
openfhe = ["recrypt-ffi/openfhe"]
liboqs = ["recrypt-ffi/liboqs"]
proptest = ["dep:proptest"]

[[bench]]
name = "crypto_ops"
harness = false

[[bench]]
name = "streaming"
harness = false
