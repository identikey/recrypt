[package]
name = "recrypt-server"
version.workspace = true
edition.workspace = true
default-run = "recrypt-server"

[dependencies]
# Workspace crates
recrypt-core = { path = "../crates/recrypt-core" }
recrypt-wire = { path = "../crates/recrypt-wire" }
recrypt-storage = { path = "../crates/recrypt-storage", features = ["s3"] }
identikey-storage-auth = { path = "../crates/identikey-storage-auth", features = [
  "sqlite",
] }
recrypt-ffi = { path = "../crates/recrypt-ffi" }

# Web
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = [
  "trace",
  "cors",
  "compression-gzip",
  "request-id",
] }

# Schema-as-source-of-truth (epic recrypt-nj1)
utoipa = { version = "5", features = ["axum_extras"] }

# Async
tokio.workspace = true
async-trait.workspace = true

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
prost = "0.13"

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Config
figment.workspace = true

# Persistence
tokio-rusqlite = { workspace = true }
rusqlite = { workspace = true }

# Rate limiting
tower_governor.workspace = true
http = "1"

# Crypto (for fingerprint handling)
blake3 = "1"
bs58.workspace = true
base64 = "0.22"
ed25519-dalek.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
figment = { workspace = true }
blake3 = "1"
recrypt-core = { path = "../crates/recrypt-core" }
identikey-storage-auth = { path = "../crates/identikey-storage-auth", features = [
  "sqlite",
] }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "proxy_cost"
harness = false
