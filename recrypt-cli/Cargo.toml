[package]
name = "recrypt-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Command-line interface for Recrypt proxy recryption"

[[bin]]
name = "recrypt"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Async
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Wallet engine (file crypto, keychain caching, envelope container)
identikey-wallet = { git = "https://github.com/identikey/identikey-protocol", branch = "main" }
zeroize = { version = "1.7", features = ["derive"] }

# Wallet body serialization (Gordian Envelope / dCBOR)
bc-envelope = "=0.43.0"

# Output
colored = "2"
indicatif = "0.17"

# Paths
directories = "5"

# Encoding
bs58 = "0.5"
base64 = "0.22"
blake3 = "1"

# Time formatting
chrono = "0.4"

# Errors
thiserror = "1"
anyhow = "1"

# Instrumentation
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Workspace crates
recrypt-core = { path = "../crates/recrypt-core" }
recrypt-wire = { path = "../crates/recrypt-wire" }
recrypt-ffi = { path = "../crates/recrypt-ffi" }
recrypt-storage = { path = "../crates/recrypt-storage" }
ed25519-dalek = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
